<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ГарантияБот</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar glass">
        <div class="brand-wrap">
          <div class="brand-dot"></div>
          <div>
            <h1>ГарантияБот</h1>
            <p class="sub">Минималистичный интерфейс с расширенной правовой аналитикой</p>
          </div>
        </div>
        <nav class="menu">
          <a href="#" class="menu-item active">Главная</a>
          <a href="#cases" class="menu-item">Кейсы</a>
          <a href="#sourceLog" class="menu-item">Источники</a>
        </nav>
      </header>

      <section class="card glass">
        <label for="problemInput">Поисковая строка / описание проблемы</label>
        <div class="row">
          <input id="problemInput" type="text" placeholder="Например: Плесень на откосе окна, квартира угловая" />
          <button id="analyzeBtn">Сформировать заключение</button>
        </div>
        <div class="row second">
          <input id="searchInput" type="text" placeholder="Поиск по сохранённой истории" />
          <button id="clearBtn" class="danger">Очистить всё</button>
        </div>
      </section>

      <section class="card glass" id="cases-section">
        <h2>Сохранённые кейсы</h2>
        <div id="cases"></div>
        <div class="row actions">
          <button id="downloadJsonBtn">Скачать JSON</button>
          <button id="downloadTxtBtn">Скачать TXT</button>
        </div>
      </section>

      <section class="card glass">
        <h2>Журнал источников</h2>
        <div id="sourceLog"></div>
      </section>
    </main>

    <dialog id="resultDialog">
      <article>
        <h2>Развернутое заключение</h2>
        <div id="resultBody"></div>
        <div class="row actions wrap">
          <button id="saveCaseBtn">Сохранить кейс</button>
          <button id="feedbackUsefulBtn">✅ Подтвердилось (обучить)</button>
          <button id="feedbackNotUsefulBtn" class="danger">❌ Не подтвердилось (обучить)</button>
          <button id="closeDialogBtn">Закрыть окно</button>
        </div>
      </article>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
