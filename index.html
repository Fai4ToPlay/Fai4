<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FerrumBot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="logo-wrap">
        <div class="logo">FB</div>
        <h1>FerrumBot</h1>
      </div>
      <button id="casesToggleBtn" class="cases-btn">Кейсы</button>
    </header>

    <aside id="casesPanel" class="cases-panel hidden">
      <div class="cases-head">
        <h2>Проработанные кейсы</h2>
        <button id="closeCasesBtn">Закрыть</button>
      </div>
      <div id="cases"></div>
    </aside>

    <main class="main-wrap">
      <section class="answer-card">
        <div id="resultBody" class="result-text">Введите запрос внизу, и FerrumBot подготовит ответ после проверки по источникам.</div>
      </section>

      <section class="input-card">
        <label for="problemInput">Опишите проблему</label>
        <div class="input-row">
          <input id="problemInput" type="text" placeholder="Например: Протечка стояка в санузле после передачи квартиры" />
          <button id="analyzeBtn">Найти ответ</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
